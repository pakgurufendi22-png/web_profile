<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Register - Web Profile</title>

  <!-- Bootstrap CDN (sama seperti halaman_login.html) -->
  <link
    href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
    rel="stylesheet"
  >

  <style>
    body {
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
    }
    .card-register {
      width: 100%;
      max-width: 420px;
    }
  </style>
</head>
<body class="bg-light">

  <div class="container">
    <div class="card card-register shadow-sm mx-auto">
      <div class="card-body p-4">

        <h1 class="text-center mb-4">Register</h1>

        <form action="#" method="post">

          <!-- Nama Lengkap -->
          <div class="mb-3">
            <label for="nama" class="form-label">Nama Lengkap</label>
            <input
              type="text"
              class="form-control"
              id="nama"
              name="nama"
              placeholder="Masukkan nama lengkap"
              required
            >
          </div>

          <!-- Email -->
          <div class="mb-3">
            <label for="email" class="form-label">Email</label>
            <input
              type="email"
              class="form-control"
              id="email"
              name="email"
              placeholder="nama@email.com"
              required
            >
          </div>

          <!-- Password -->
          <div class="mb-3">
            <label for="password" class="form-label">Password</label>
            <input
              type="password"
              class="form-control"
              id="password"
              name="password"
              placeholder="Minimal 6 karakter"
              minlength="6"
              required
            >
          </div>

          <!-- Konfirmasi Password -->
          <div class="mb-3">
            <label for="password2" class="form-label">Konfirmasi Password</label>
            <input
              type="password"
              class="form-control"
              id="password2"
              name="password2"
              placeholder="Ulangi password"
              minlength="6"
              required
            >
          </div>

          <!-- Tombol -->
          <button type="submit" class="btn btn-primary w-100">
            Daftar
          </button>

        </form>

        <hr class="my-4">

        <p class="text-center mb-0">
          Sudah punya akun?
          <a href="halaman_login.html">Login di sini</a>
        </p>

      </div>
    </div>
  </div>

  <!-- Bootstrap JS (opsional, untuk komponen interaktif) -->
  <script
    src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"
  ></script>

</body>
</html>
